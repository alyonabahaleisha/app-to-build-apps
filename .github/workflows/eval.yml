name: Eval

# Triggers on changes to LLM modules, the shared protocol package, or the V0 renderer.
# ADR-0007 Step 7 — T-0007-175.
on:
  push:
    paths:
      - 'services/api/src/llm/**'
      - 'packages/protocol/**'
      - 'packages/a2ui-renderer/src/v0/components/**'
  pull_request:
    paths:
      - 'services/api/src/llm/**'
      - 'packages/protocol/**'
      - 'packages/a2ui-renderer/src/v0/components/**'

# CI gate: --mode=v0 runs the full 100-prompt archetype eval set.
# Pass threshold ≥90% overall, ≥80% per archetype.
# --mode=out-of-scope-detection is a separate job (threshold ≥95%).
#
# ADR-0007 Step 7 change note (Eva — DevOps review required post-merge):
#   Changed from: pnpm --filter @app-creator/api eval -- --mode=new
#   Changed to:   pnpm --filter @app-creator/api eval -- --mode=v0
#   Rationale: V0 cutover; M1 Plan→Build pipeline modes retired (legacy, planner, new, shadow).
#   out-of-scope-detection added as a second CI job.
#   Path filters updated: packages/a2ui-schema replaced with packages/protocol +
#     packages/a2ui-renderer/src/v0/components.

jobs:
  eval-v0:
    name: Generation Quality Eval (v0)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Short-circuit telemetry DB writes during eval — T-0007-169.
      EVAL_MODE: 'true'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval — mode=v0 (CI gate ≥90% overall, ≥80% per archetype) — T-0007-176
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @app-creator/api eval -- --mode=v0

      # ADR-0010 Step 3 — regression gate runs after the eval writes results.
      # Compares the freshly-written results JSON against services/api/eval/baseline.json.
      # Exits 1 (blocked) if overall drop > 2pp OR any archetype drop > 3pp.
      # Override: add `INTENTIONAL_EVAL_REGRESSION: <rationale>` to the PR body.
      # T-0010-080.
      - name: Check eval regression (ADR-0010 regression gate)
        env:
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm --filter @app-creator/api eval:check-regression

  eval-out-of-scope:
    name: Out-of-Scope Detection Eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EVAL_MODE: 'true'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval — mode=out-of-scope-detection (CI gate ≥95%)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @app-creator/api eval -- --mode=out-of-scope-detection
